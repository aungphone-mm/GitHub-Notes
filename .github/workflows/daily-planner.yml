name: daily-planner

on:
  # 23:30 UTC == 06:00 the next day in Yangon (UTC+6:30)
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/PLANNER.md
