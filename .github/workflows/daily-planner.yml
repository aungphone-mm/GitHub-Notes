name: daily-planner

on:
  # Manual only: run from the Actions tab when a planner issue is wanted.
  workflow_dispatch:

jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      # checkout needs contents:read to clone a private repository — naming
      # only issues:write drops every other scope from GITHUB_TOKEN.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/PLANNER.md
